<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>World Architecture & Landmarks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        /* Deep Tech Background with Subtle Coordinate Grid & Ambient Glow */
        body {
            background-color: #050811;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(16, 185, 129, 0.12), transparent 35%),
                radial-gradient(circle at 85% 80%, rgba(6, 182, 212, 0.12), transparent 35%),
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* Glassmorphic Map HUD Container */
        .map-box {
            position: relative;
            max-width: 1150px;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 0 30px rgba(16, 185, 129, 0.05);
            overflow: hidden;
        }

        /* Holographic Cyan/Emerald Tinted World Map */
        .map-img {
            width: 100%;
            display: block;
            filter: invert(1) sepia(1) hue-rotate(135deg) saturate(2.5) brightness(0.7) opacity(0.45);
        }

        /* Glowing Radar-Beacon Pins */
        .pin {
            position: absolute;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            background: rgba(16, 185, 129, 0.2);
            backdrop-filter: blur(4px);
            color: #ecfdf5;
            border: 1.5px solid #10b981;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
            font-size: 10px;
            font-family: monospace;
            font-weight: 700;
            padding: 0;
            line-height: 23px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            z-index: 2;
        }

        .pin:hover {
            transform: translate(-50%, -50%) scale(1.45);
            background: #10b981;
            color: #050811;
            box-shadow: 0 0 22px #10b981, 0 0 40px rgba(16, 185, 129, 0.8);
            z-index: 10;
        }

        /* Glassmorphism Cards */
        .card {
            background: rgba(15, 23, 42, 0.45) !important;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 16px;
            color: #f8fafc;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-6px);
            background: rgba(30, 41, 59, 0.65) !important;
            border-color: rgba(16, 185, 129, 0.5) !important;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 20px rgba(16, 185, 129, 0.15);
        }

        .card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.4s ease;
        }

        .card:hover img {
            transform: scale(1.03);
        }

        /* Tech Badges & Monospace Accents */
        .tech-badge {
            background: rgba(16, 185, 129, 0.12);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
            font-family: monospace;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .tech-label {
            color: #94a3b8;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Glassmorphism Modal */
        .modal-content {
            background: rgba(10, 15, 29, 0.8) !important;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 30px rgba(16, 185, 129, 0.15);
        }

        .modal-img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body>
    <div class="container py-4">

        <!-- HEADER -->
        <div class="row mb-3">
            <div class="col-12 text-center">
                <span class="badge tech-badge rounded-pill px-3 py-2 mb-2">GEOSPATIAL ARCHITECTURE INDEX // v1.0</span>
                <h2 class="fw-bold text-white tracking-tight">World Architectural Landmarks</h2>
                <p class="text-secondary small">Select a coordinate beacon on the map or inspect a data card below</p>
            </div>
        </div>

        <!-- INTERACTIVE MAP -->
        <div class="row mb-5">
            <div class="col-12">
                <div class="map-box p-3" id="map-pins">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg"
                        class="map-img" alt="World Map">
                </div>
            </div>
        </div>

        <!-- CARD GRID -->
        <div class="row g-3" id="parent">

        </div>

        <!-- MODALS CONTAINER -->
        <div id="modals">

        </div>

    </div>

            var factList = "";
            for (var j = 0; j < landmarks[i].facts.length; j++) {

          title="` + landmarks[i].name + `"
          style="top: ` + landmarks[i].top + `; left: ` + landmarks[i].left + `;">
          ` + landmarks[i].id + `
        </button>
      `;

            // 2. Add Glassmorphic Card to the Grid

        <div class="col-12 col-sm-6 col-lg-4">
          <div class="card p-3 h-100" data-bs-toggle="modal" data-bs-target="#modal` + landmarks[i].id + `">

</body>

</html>
