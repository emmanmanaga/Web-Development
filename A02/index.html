<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>World Architecture & Landmarks</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"></path>
        </svg>
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path
                d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42">
            </path>
        </svg>
    </button>

    <section class="map-box" id="world-map" aria-label="Interactive world map of architectural landmarks">
        <div class="map-canvas">
            <img src="https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg"
                class="map-img" alt="World map">
            <div class="pin-layer" id="map-pins"></div>
            <span class="landmark-float" id="landmark-preview" aria-live="polite"></span>
            <div class="hero-copy" id="hero-copy">
                <p class="hero-eyebrow">Architecture around the world</p>
                <h1 class="hero-title">World Architectural Landmarks</h1>
                <p class="hero-subtitle">Explore from side to side, then select a marker for details.</p>
            </div>
        </div>
    </section>

    <section class="detail-overlay" id="detail-overlay" data-open="false" data-zoomed="false" aria-hidden="true"
        aria-label="Landmark details">
        <div class="zoom-scene" id="zoom-scene" aria-hidden="true">
            <img class="zoom-map"
                src="https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg" alt="">
            <span class="zoom-marker" id="zoom-marker"></span>
        </div>
        <button class="detail-close" id="detail-close" type="button" aria-label="Close landmark details">×</button>
        <div class="detail-content" id="detail-content" role="dialog" aria-modal="true"
            aria-labelledby="detail-title"></div>
    </section>

    <script>
        var landmarks = [
            {
                id: 1,

                transparentImage: true,
                top: "38%",
                left: "55%"
            }, {
                id: 2,
                name: "Great Ziggurat of Ur",
                country: "Dhi Qar, Iraq",

                top: "35%",
                left: "60%"
            }, {
                id: 3,

                image: "assets/images/landmarks/taj-mahal.png",
                transparentImage: true,
                top: "40%",
                left: "70%"
            }, {
                id: 9,
                name: "Sagrada Família",
                country: "Barcelona, Spain",
                era: "Modern (1882)",
                style: "Catalan Modernisme",
                architect: "Antoni Gaudí",
                description: "The largest unfinished Catholic church in the world, combining Gothic and curvilinear Art Nouveau forms inspired by nature.",
                facts: ["Interior columns branch out like trees to support the vaulting", "Under construction for more than 140 years"],
                image: "assets/images/landmarks/sagrada-fam-lia.png",
                transparentImage: true,
                top: "31%",
                left: "47%"
            }, {
                id: 10,
                name: "Eiffel Tower",
                country: "Paris, France",
                era: "Modern (1889)",
                style: "Structural Iron",
                architect: "Gustave Eiffel & Stephen Sauvestre",
                description: "A wrought-iron lattice tower on the Champ de Mars built as the centerpiece of the 1889 World's Fair.",
                facts: ["Assembled from 18,038 puddle iron parts joined by 2.5 million rivets", "Grows up to 15 cm taller during summer due to thermal expansion"],
                image: "assets/images/landmarks/eiffel-tower.png",
                transparentImage: true,
                top: "27%",
                left: "48%"
            }, {
                id: 11,
                name: "Fallingwater",
                country: "Pennsylvania, USA",
                era: "Modern (1935)",
                style: "Organic Architecture",
                architect: "Frank Lloyd Wright",
                description: "A famous residence built partly over a waterfall on Bear Run, seamlessly integrating human shelter with the natural landscape.",
                facts: ["Uses dramatic cantilevered reinforced concrete terraces", "Local Pottsville sandstone was quarried directly on site"],
                image: "assets/images/landmarks/fallingwater.png",
                transparentImage: true,
                top: "30%",
                left: "26%"
            }, {
                id: 12,
                name: "Sydney Opera House",
                country: "Sydney, Australia",
                era: "Modern (1973)",
                style: "Expressionist Modernism",
                architect: "Jørn Utzon",
                description: "A multi-venue performing arts centre defined by its soaring interlocking precast concrete shells.",
                facts: ["Roof shells are covered with over 1 million Swedish ceramic tiles", "Cooled using seawater pumped directly from Sydney Harbour"],
                image: "assets/images/landmarks/sydney-opera-house.png",
                transparentImage: true,
                top: "76%",
                left: "88%"
            }, {
                id: 13,
                name: "Angel of the North",
                country: "Gateshead, United Kingdom",
                era: "Contemporary (1998)",
                style: "Monumental Sculpture",
                architect: "Antony Gormley",
                description: "A massive contemporary steel sculpture standing on a hilltop in Northeast England, honoring the region's coal mining history.",
                facts: ["Wingspan measures 54 meters—wider than a Boeing 757", "Built from COR-TEN weather-resistant steel to withstand 100 mph winds"],
                image: "assets/images/landmarks/angel-of-the-north.png",
                transparentImage: true,
                top: "23%",
                left: "47%"
            }, {
                id: 14,
                name: "Walt Disney Concert Hall",
                country: "Los Angeles, USA",
                era: "Contemporary (2003)",
                style: "Deconstructivism",
                architect: "Frank Gehry",
                description: "A landmark concert hall encased in sweeping, undulating stainless-steel sails designed to evoke musical movement.",
                facts: ["Auditorium interior is paneled in Douglas fir for world-class acoustics", "Exterior steel panels were lightly sanded to reduce blinding glare"],
                image: "assets/images/landmarks/walt-disney-concert-hall.png",
                transparentImage: true,
                top: "34%",
                left: "17%"
            }, {
                id: 15,
                name: "Burj Khalifa",
                country: "Dubai, UAE",
                era: "Contemporary (2010)",
                style: "Neo-Futurism",
                architect: "Adrian Smith (SOM)",
                description: "A megatall skyscraper in Dubai standing at 828 meters, making it the tallest structure and building in the world.",
                facts: ["Uses a buttressed Y-shaped floor plan inspired by the Hymenocallis flower", "Features 163 habitable floors and the world's fastest double-deck elevators"],
                image: "assets/images/landmarks/burj-khalifa.png",
                transparentImage: true,
                top: "40%",
                left: "63%"
            }, {
                id: 16,
                name: "Heydar Aliyev Center",
                country: "Baku, Azerbaijan",
                era: "Contemporary (2012)",
                style: "Parametric Neo-Futurism",
                architect: "Zaha Hadid",
                description: "A cultural complex renowned for its fluid, wave-like skin that folds continuously from the surrounding plaza into the building.",
                facts: ["Designed with virtually no sharp angles or straight lines", "Clad in over 12,000 individually molded fiberglass-reinforced panels"],
                image: "assets/images/landmarks/heydar-aliyev-center.png",
                transparentImage: true,
                top: "31%",
                left: "62%"
            }, {
                id: 17,
                name: "The Kelpies",
                country: "Falkirk, Scotland",
                era: "Contemporary (2013)",
                style: "Monumental Public Art",
                architect: "Andy Scott",
                description: "A pair of 30-meter-high horse-head sculptures celebrating Scotland's horse-powered industrial and canal heritage.",
                facts: ["Each head weighs 300 tonnes and is clad in 464 stainless steel plates", "Inspired by mythological shape-shifting water spirits of Scottish folklore"],
                image: "assets/images/landmarks/the-kelpies.png",
                transparentImage: true,
                top: "20%",
                left: "46%"
            }, {
                id: 18,
                name: "Christ the Redeemer",
                country: "Rio de Janeiro, Brazil",
                era: "Modern (1931)",
                style: "Art Deco",
                architect: "Heitor da Silva Costa",
                description: "A monumental statue of Jesus Christ overlooking Rio de Janeiro from the summit of Mount Corcovado.",
                facts: ["Stands 30 meters tall, not including its 8-meter pedestal", "Designed by Heitor da Silva Costa with sculptural work by Paul Landowski"],
                image: "assets/images/landmarks/christ-the-redeemer.png",
                transparentImage: false,
                top: "61%",
                left: "34%"
            }, {
                id: 19,
                name: "Great Wall of China",
                country: "Northern China",
                era: "Ancient (7th century BC onward)",
                style: "Military Fortification",
                architect: "Built by successive Chinese states and dynasties",
                description: "A vast system of walls, passes, and fortifications built and rebuilt across centuries to defend China's northern frontier.",
                facts: ["The best-known surviving sections largely date from the Ming dynasty", "The wall's branches and associated defenses extend for tens of thousands of kilometers"],
                image: "assets/images/landmarks/great-wall-of-china.png",
                transparentImage: false,
                top: "34%",
                left: "79%"
            }
        ];

        var mapPins = document.getElementById("map-pins");
        var mapBox = document.getElementById("world-map");
        var heroEyebrow = document.querySelector(".hero-eyebrow");
        var heroTitle = document.querySelector(".hero-title");
        var heroSubtitle = document.querySelector(".hero-subtitle");
        var themeToggle = document.getElementById("theme-toggle");
        var preview = document.getElementById("landmark-preview");
        var activePin = null;
        var hidePreviewTimer;
        var detailOverlay = document.getElementById("detail-overlay");
        var zoomScene = document.getElementById("zoom-scene");
        var zoomMarker = document.getElementById("zoom-marker");
        var detailClose = document.getElementById("detail-close");
        var detailContent = document.getElementById("detail-content");
        var selectedPin = null;

        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, function (character) {
                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    "\"": "&quot;",
                    "'": "&#39;"
                }[character];
            });
        }

        themeToggle.addEventListener("click", function () {
            var isDark = document.body.dataset.theme !== "dark";
            document.body.dataset.theme = isDark ? "dark" : "light";
            themeToggle.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
            themeToggle.setAttribute("aria-pressed", String(isDark));
        });

        mapBox.addEventListener("pointermove", function (event) {
            if (event.pointerType !== "mouse" && event.pointerType !== "pen") return;

            var isOverText = [heroEyebrow, heroTitle, heroSubtitle].some(function (element) {
                var rect = element.getBoundingClientRect();
                return event.clientX >= rect.left && event.clientX <= rect.right
                    && event.clientY >= rect.top && event.clientY <= rect.bottom;
            });
            heroEyebrow.style.opacity = isOverText ? "0" : "1";
            heroTitle.style.opacity = isOverText ? "0" : "1";
            heroSubtitle.style.opacity = isOverText ? "0" : "1";
        });

        mapBox.addEventListener("pointerleave", function () {
            heroEyebrow.style.opacity = "1";
            heroTitle.style.opacity = "1";
            heroSubtitle.style.opacity = "1";
        });

        function positionPreview() {
            if (!activePin) return;

            var canvas = document.querySelector(".map-canvas");
            var canvasRect = canvas.getBoundingClientRect();
            var pinRect = activePin.getBoundingClientRect();
            var previewRect = preview.getBoundingClientRect();
            var pinX = pinRect.left + pinRect.width / 2 - canvasRect.left;
            var pinY = pinRect.top + pinRect.height / 2 - canvasRect.top;
            var isMobile = window.matchMedia("(max-width: 576px)").matches;
            var visibleLeft = (isMobile ? mapBox.scrollLeft : 0) + previewRect.width / 2 + 12;
            var visibleRight = (isMobile ? mapBox.scrollLeft + mapBox.clientWidth : canvasRect.width)
                - previewRect.width / 2 - 12;
            var left = pinX;
            var top = pinY;

            left = Math.max(visibleLeft, Math.min(left, visibleRight));
            top = Math.max(12, Math.min(top, canvasRect.height - previewRect.height - 12));
            preview.style.left = left + "px";
            preview.style.top = top + "px";
        }

        function showPreview(landmark, pin) {
            if (activePin && activePin !== pin) activePin.setAttribute("aria-expanded", "false");
            activePin = pin;
            preview.textContent = landmark.name;
            preview.dataset.visible = "true";
            preview.setAttribute("aria-hidden", "false");
            pin.setAttribute("aria-expanded", "true");
            positionPreview();
        }

        function closePreview() {
            if (activePin) activePin.setAttribute("aria-expanded", "false");
            activePin = null;
            preview.dataset.visible = "false";
            preview.setAttribute("aria-hidden", "true");
        }

        function openDetail(landmark, pin) {
            window.clearTimeout(hidePreviewTimer);
            closePreview();
            selectedPin = pin;
            selectedPin.setAttribute("aria-expanded", "true");
            document.body.dataset.detailOpen = "true";

            detailContent.innerHTML = `
                <img class="detail-image" data-cutout="${escapeHTML(Boolean(landmark.transparentImage))}"
                    data-landmark-id="${escapeHTML(landmark.id)}" src="${escapeHTML(landmark.image)}"
                    alt="${escapeHTML(landmark.name)}">
                <div class="detail-copy">
                    <p class="detail-eyebrow">${escapeHTML(landmark.era)} · ${escapeHTML(landmark.style)}</p>
                    <h2 class="detail-title" id="detail-title">${escapeHTML(landmark.name)}</h2>
                    <p class="detail-location">${escapeHTML(landmark.country)}</p>
                    <p class="detail-description">${escapeHTML(landmark.description)}</p>
                    <p class="detail-architect"><strong>Architect:</strong> ${escapeHTML(landmark.architect)}</p>
                    <h3 class="detail-facts-title">Structural highlights</h3>
                    <ul class="detail-facts">${landmark.facts.map(function (fact) {
                        return `<li>${escapeHTML(fact)}</li>`;
                    }).join("")}</ul>
                </div>
            `;

            var detailImage = detailContent.querySelector(".detail-image");
            detailImage.addEventListener("error", function () {
                detailImage.alt = landmark.name + " image unavailable";
            });

            var scale = window.innerWidth < 576 ? 3.2 : 2.7;
            var pinX = window.innerWidth * parseFloat(landmark.left) / 100;
            var pinY = window.innerHeight * (parseFloat(landmark.top) + 2) / 100;
            zoomMarker.textContent = landmark.id;
            zoomMarker.style.setProperty("--pin-x", landmark.left);
            zoomMarker.style.setProperty("--pin-y", "calc(" + landmark.top + " + 2%)");
            zoomScene.style.setProperty("--zoom-scale", scale);
            zoomScene.style.setProperty("--zoom-x", (window.innerWidth / 2 - scale * pinX) + "px");
            zoomScene.style.setProperty("--zoom-y", (window.innerHeight / 2 - scale * pinY) + "px");
            detailOverlay.setAttribute("aria-hidden", "false");
            detailOverlay.dataset.open = "true";
            detailOverlay.dataset.zoomed = "false";
            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    detailOverlay.dataset.zoomed = "true";
                });
            });
            detailClose.focus();
        }

        function closeDetail() {
            if (detailOverlay.dataset.open !== "true") return;
            detailOverlay.dataset.zoomed = "false";
            detailOverlay.dataset.open = "false";
            detailOverlay.setAttribute("aria-hidden", "true");
            delete document.body.dataset.detailOpen;
            if (selectedPin) {
                selectedPin.setAttribute("aria-expanded", "false");
                selectedPin.focus();
                selectedPin = null;
            }
        }

        function schedulePreviewClose() {
            window.clearTimeout(hidePreviewTimer);
            hidePreviewTimer = window.setTimeout(function () {
                closePreview();
            }, 180);
        }

        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape") {
                closeDetail();
                closePreview();
            } else if (event.key === "Tab" && detailOverlay.dataset.open === "true") {
                var focusable = detailOverlay.querySelectorAll("button, a[href]");
                var first = focusable[0];
                var last = focusable[focusable.length - 1];
                if (event.shiftKey && document.activeElement === first) {
                    event.preventDefault();
                    last.focus();
                } else if (!event.shiftKey && document.activeElement === last) {
                    event.preventDefault();
                    first.focus();
                }
            }
        });

        window.addEventListener("resize", positionPreview);
        mapBox.addEventListener("scroll", positionPreview);
        detailClose.addEventListener("click", closeDetail);
        detailOverlay.addEventListener("click", function (event) {
            if (event.target === detailOverlay) closeDetail();
        });

        for (var i = 0; i < landmarks.length; i++) {
            (function (landmark) {
                var pin = document.createElement("button");
                pin.className = "pin";
                pin.type = "button";
                pin.textContent = landmark.id;
                pin.title = landmark.name;
                pin.setAttribute("aria-label", "Explore " + landmark.name);
                pin.setAttribute("aria-expanded", "false");
                pin.dataset.landmarkId = landmark.id;
                pin.style.top = "calc(" + landmark.top + " + 2%)";
                pin.style.left = landmark.left;

                pin.addEventListener("pointerenter", function (event) {
                    if (event.pointerType === "mouse") {
                        window.clearTimeout(hidePreviewTimer);
                        showPreview(landmark, pin);
                    }
                });

                pin.addEventListener("pointerleave", schedulePreviewClose);

                pin.addEventListener("focus", function () {
                    window.clearTimeout(hidePreviewTimer);
                    showPreview(landmark, pin);
                });

                pin.addEventListener("blur", schedulePreviewClose);

                pin.addEventListener("click", function () {
                    openDetail(landmark, pin);
                });

                mapPins.appendChild(pin);
            })(landmarks[i]);
        }
    </script>

</body>

</html>
