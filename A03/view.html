<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pokémon details — The Pokémon Collection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        :root {
            color-scheme: light;
            --ink: #292c29;
            --muted: #858981;
            --line: #eeece6;
            --sage: #748a70;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            background: #f7f6f2;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        .showcase-container {
            position: relative;
            display: flex;
            min-height: 50vh;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #e8f5e9;
            transition: background-color 0.45s ease;
        }

        .showcase-container::before {
            position: absolute;
            right: -12%;
            bottom: -32%;
            width: min(80vw, 680px);
            aspect-ratio: 1;
            border: 1px solid rgba(75, 86, 73, 0.08);
            border-radius: 50%;
            content: "";
        }

        .showcase-container::after {
            position: absolute;
            right: -5%;
            bottom: -24%;
            width: min(65vw, 540px);
            aspect-ratio: 1;
            border: 1px solid rgba(75, 86, 73, 0.08);
            border-radius: 50%;
            content: "";
        }

        .showcase-model {
            z-index: 1;
            width: 100%;
            height: min(50vh, 500px);
            min-height: 320px;
            max-height: 720px;
            background: transparent;
        }

        .info-panel {
            min-height: 50vh;
            background: #fff;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.035);
        }

        .back-link {
            color: #647860;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 650;
        }

        .back-link:hover {
            color: #394b37;
        }

        .eyebrow {
            color: var(--muted);
            font-size: 0.68rem;
            font-weight: 750;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .poke-title {
            color: var(--ink);
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 800;
            letter-spacing: -0.06em;
            text-transform: capitalize;
        }

        .poke-id {
            color: #a4a69e;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .type-pill {
            display: inline-block;
            margin: 0 0.4rem 0.45rem 0;
            padding: 0.45rem 0.9rem;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 750;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .stat-row {
            margin-bottom: 1.25rem;
        }

        .stat-name,
        .stat-value {
            color: #545850;
            font-size: 0.78rem;
            font-weight: 750;
            letter-spacing: 0.06em;
        }

        .stat-track {
            height: 7px;
            overflow: hidden;
            border-radius: 8px;
            background: #f0f0eb;
        }

        .stat-bar {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: #748a70;
            transition: width 0.5s ease;
        }

        .roster-btn {
            display: flex;
            width: 100%;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 0.55rem;
            padding: 0.75rem 1rem;
            border: 1px solid transparent;
            border-radius: 14px;
            color: #51564e;
            background: #f7f7f3;
            font-size: 0.9rem;
            font-weight: 650;
            text-align: left;
            text-transform: capitalize;
            transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
        }

        .roster-btn:hover {
            transform: translateX(3px);
            background: #edf1e9;
        }

        .roster-btn.active {
            border-color: #dfe7db;
            color: #465c43;
            background: #eaf0e7;
        }

        .roster-number {
            color: #9a9d94;
            font-size: 0.72rem;
            font-variant-numeric: tabular-nums;
        }

        .loader-state {
            display: grid;
            min-height: 45vh;
            place-content: center;
            gap: 1rem;
            padding: 2rem;
            color: var(--muted);
            text-align: center;
        }

        .error-state {
            color: #a64646;
        }

        @media (min-width: 992px) {
            .showcase-container,
            .info-panel {
                min-height: 100vh;
                height: 100vh;
            }

            .showcase-model {
                height: 90vh;
            }

            .info-panel {
                overflow-y: auto;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <main class="container-fluid p-0">
        <div class="row g-0">
            <section id="showcaseContainer" class="col-12 col-lg-8 showcase-container"
                aria-label="Interactive 3D Pokémon showcase">
                <model-viewer id="mainModel" class="showcase-model" src="" alt="Pokémon 3D model"
                    camera-controls auto-rotate shadow-intensity="0.5" shadow-softness="1" exposure="1"
                    disable-zoom>
                </model-viewer>
            </section>

            <section class="col-12 col-lg-4 info-panel p-4 p-xl-5">
                <a class="back-link d-inline-flex align-items-center gap-2 mb-5" href="index.html">
                    <span aria-hidden="true">←</span> Back to collection
                </a>

                <div id="loader" class="loader-state" role="status">
                    <div class="spinner-border mx-auto" style="color: var(--sage);" aria-hidden="true"></div>
                    <p class="mb-0">Preparing your Pokémon showcase…</p>
                </div>

                <div id="errorState" class="loader-state error-state" role="alert" hidden>
                    <h1 class="h4">Pokémon unavailable</h1>
                    <p id="errorMessage" class="mb-0"></p>
                    <a class="back-link" href="index.html">Return to the collection</a>
                </div>

                <div id="content" hidden>
                    <div class="eyebrow mb-2">Pokédex entry</div>
                    <div class="d-flex justify-content-between align-items-end gap-3 mb-2">
                        <h1 class="poke-title mb-0" id="pokeName"></h1>
                        <span class="poke-id mb-2" id="pokeId"></span>
                    </div>
                    <div id="pokeTypes" class="mb-5" aria-label="Pokémon types"></div>

                    <h2 class="eyebrow mb-4">Base statistics</h2>
                    <div class="stat-row">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="stat-name">HP</span><span class="stat-value" id="statHp"></span>
                        </div>
                        <div class="stat-track"><div class="stat-bar" id="barHp"></div></div>
                    </div>
                    <div class="stat-row">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="stat-name">ATTACK</span><span class="stat-value" id="statAttack"></span>
                        </div>
                        <div class="stat-track"><div class="stat-bar" id="barAttack"></div></div>
                    </div>
                    <div class="stat-row mb-5">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="stat-name">DEFENSE</span><span class="stat-value" id="statDefense"></span>
                        </div>
                        <div class="stat-track"><div class="stat-bar" id="barDefense"></div></div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="eyebrow mb-0">Featured collection</h2>
                    </div>
                    <div id="rosterList" aria-label="Featured Pokémon"></div>
                </div>
            </section>
        </div>
    </main>

    <script>
        const featuredIds = [1, 4, 7, 25, 94, 150];
        const typeThemes = {
            normal: { bg: '#f0eee8', pill: '#e9e6db', text: '#5d5a50' },
            fire: { bg: '#fbe9e2', pill: '#f6d5c7', text: '#945441' },
            water: { bg: '#e5f0f8', pill: '#d1e5f4', text: '#426980' },
            electric: { bg: '#fbf4d9', pill: '#f3e8b3', text: '#81702d' },
            grass: { bg: '#e8f2e5', pill: '#d7e9d2', text: '#4c7147' },
            ice: { bg: '#e4f2f1', pill: '#d2eae8', text: '#46716e' },
            fighting: { bg: '#f4e5e1', pill: '#ecd2cb', text: '#875045' },
            poison: { bg: '#f0e8f3', pill: '#e5d7eb', text: '#72537e' },
            ground: { bg: '#f2ecdf', pill: '#e8ddc6', text: '#786746' },
            flying: { bg: '#ececf5', pill: '#deddec', text: '#625d83' },
            psychic: { bg: '#f7e7ed', pill: '#f0d4df', text: '#8a5268' },
            bug: { bg: '#eef0df', pill: '#e1e6c6', text: '#66703d' },
            rock: { bg: '#efecdf', pill: '#e3dec5', text: '#756e4c' },
            ghost: { bg: '#ede9f3', pill: '#ddd6e9', text: '#62547d' },
            dragon: { bg: '#ebe8f5', pill: '#dcd7ef', text: '#605687' },
            dark: { bg: '#ece9e6', pill: '#ded9d3', text: '#62594f' },
            steel: { bg: '#eceef0', pill: '#dfe3e7', text: '#5e6872' },
            fairy: { bg: '#f7e9f0', pill: '#f1d8e5', text: '#895b73' }
        };
        const pokemonCache = new Map();
        const loader = document.getElementById('loader');
        const content = document.getElementById('content');
        const errorState = document.getElementById('errorState');
        const modelViewer = document.getElementById('mainModel');
        const requestedPokemon = new URLSearchParams(window.location.search).get('id') || '1';

        async function fetchPokemon(idOrName) {
            const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${encodeURIComponent(idOrName)}`);
            if (!response.ok) {
                throw new Error(response.status === 404
                    ? 'This Pokédex entry could not be found. Return to the collection and choose another Pokémon.'
                    : 'The Pokédex could not be reached. Please try again in a moment.');
            }
            return response.json();
        }

        function setStat(stat, value) {
            document.getElementById(`stat${stat}`).textContent = value;
            document.getElementById(`bar${stat}`).style.width = `${Math.min(value / 255 * 100, 100)}%`;
        }

        function renderPokemon(pokemon) {
            const name = pokemon.name.charAt(0).toUpperCase() + pokemon.name.slice(1);
            const primaryType = pokemon.types[0].type.name;
            const theme = typeThemes[primaryType] || typeThemes.normal;

            document.title = `${name} — The Pokémon Collection`;
            document.getElementById('pokeName').textContent = name;
            document.getElementById('pokeId').textContent = `#${String(pokemon.id).padStart(3, '0')}`;
            document.getElementById('showcaseContainer').style.backgroundColor = theme.bg;
            modelViewer.src = `https://raw.githubusercontent.com/Pokemon-3D-api/assets/main/models/opt/regular/${pokemon.id}.glb`;
            modelViewer.poster = pokemon.sprites.other['official-artwork'].front_default || '';
            modelViewer.alt = `${name} 3D model`;

            const types = document.getElementById('pokeTypes');
            types.replaceChildren(...pokemon.types.map(({ type }) => {
                const typeTheme = typeThemes[type.name] || typeThemes.normal;
                const pill = document.createElement('span');
                pill.className = 'type-pill';
                pill.textContent = type.name;
                pill.style.backgroundColor = typeTheme.pill;
                pill.style.color = typeTheme.text;
                return pill;
            }));

            setStat('Hp', pokemon.stats.find(({ stat }) => stat.name === 'hp').base_stat);
            setStat('Attack', pokemon.stats.find(({ stat }) => stat.name === 'attack').base_stat);
            setStat('Defense', pokemon.stats.find(({ stat }) => stat.name === 'defense').base_stat);

            document.querySelectorAll('.roster-btn').forEach(button => {
                const selected = Number(button.dataset.pokemonId) === pokemon.id;
                button.classList.toggle('active', selected);
                if (selected) button.setAttribute('aria-current', 'true');
                else button.removeAttribute('aria-current');
            });
        }

        function buildRoster(roster) {
            const rosterList = document.getElementById('rosterList');
            rosterList.replaceChildren(...roster.map(pokemon => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'roster-btn';
                button.dataset.pokemonId = pokemon.id;

                const number = document.createElement('span');
                number.className = 'roster-number';
                number.textContent = `#${String(pokemon.id).padStart(3, '0')}`;
                const name = document.createElement('span');
                name.textContent = pokemon.name;
                button.append(number, name);

                button.addEventListener('click', () => {
                    renderPokemon(pokemon);
                    history.replaceState(null, '', `view.html?id=${pokemon.id}`);
                });
                return button;
            }));
        }

        async function initializeView() {
            try {
                const [selectedPokemon, roster] = await Promise.all([
                    fetchPokemon(requestedPokemon),
                    Promise.all(featuredIds.map(async id => {
                        const pokemon = await fetchPokemon(id);
                        pokemonCache.set(pokemon.id, pokemon);
                        return pokemon;
                    }))
                ]);
                pokemonCache.set(selectedPokemon.id, selectedPokemon);
                buildRoster(roster);
                renderPokemon(selectedPokemon);
                loader.hidden = true;
                content.hidden = false;
            } catch (error) {
                console.error('Pokémon detail error:', error);
                loader.hidden = true;
                document.getElementById('errorMessage').textContent = error.message;
                errorState.hidden = false;
            }
        }

        initializeView();
    </script>
</body>

</html>
